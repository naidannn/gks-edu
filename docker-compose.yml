name: gks-edu

services:
  # Optional: local Postgres 17 + pgvector, for working without Supabase.
  # Opt in with `pnpm db:up:local` (or `docker compose --profile local-db up -d`).
  postgres:
    image: pgvector/pgvector:pg17
    container_name: gks-postgres
    profiles: ['local-db']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gks_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-gks_edu}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gks} -d ${POSTGRES_DB:-gks_edu}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: gks-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
